name: Build NoTrace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build all supported versions
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build all targets
        run: ./gradlew buildAll --no-daemon

      - name: Upload Minecraft 1.21.11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTrace-1.21.11
          path: |
            mc-1.21.11/build/libs/NoTrace-1.21.11-*.jar
            !mc-1.21.11/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload Minecraft 26.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTrace-26.1
          path: |
            mc-26.1/build/libs/NoTrace-26.1-*.jar
            !mc-26.1/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload Minecraft 26.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoTrace-26.2
          path: |
            mc-26.2/build/libs/NoTrace-26.2-*.jar
            !mc-26.2/build/libs/*-sources.jar
          if-no-files-found: error
