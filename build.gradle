plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

tasks.register("buildAll") {
	group = "build"
	description = "Build NoTrace for every supported Minecraft version."
	dependsOn(
			":mc-1.21.11:build",
			":mc-26.x:build"
	)
}

tasks.register("runAllClients") {
	group = "fabric"
	description = "Launch every supported Minecraft client. Use --parallel to run them concurrently."
	dependsOn(
			":mc-1.21.11:runClient",
			":mc-26.x:runClient"
	)
}
